[project]
name = "praxis"
version = "0.1.0"
description = "Backend de Praxis Asesor — sistema operativo del despacho parlamentario"
authors = [
    { name = "Agustín DM", email = "agustindm.uba@gmail.com" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

# Dependencias de producción.
dependencies = [
    # Web framework + servidor ASGI.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # Validación / configuración tipada.
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # ORM async + driver Postgres + migraciones.
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",

    # Cola de tareas.
    "celery[redis]>=5.4",

    # Cliente Redis directo (para readiness checks, cache, etc., además del uso vía Celery).
    "redis>=5.0",

    # HTTP client (scraping, integraciones).
    "httpx>=0.27",

    # Parseo HTML (scrapers HCDN y HSN).
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # Logging estructurado.
    "structlog>=24.4",
]

# Dependencias de desarrollo (PEP 735 — soportado por uv).
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-passlib",
    # SQLite async para tests de repos sin levantar Postgres.
    "aiosqlite>=0.20",
]

# Build backend para que `uv sync` instale el paquete `praxis` en modo editable.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis"]

# -------------------------------------------------------------------
# ruff — lint + format (reemplaza black, isort, flake8).
# -------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Conjunto de reglas declarado en CLAUDE.md §5 "Python (backend)".
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (orden de imports)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernizar sintaxis)
    "B",    # flake8-bugbear (anti-patterns)
    "A",    # flake8-builtins (no shadowear builtins)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# En tests, asserts son legítimos; nombres no convencionales (fixtures) también.
"tests/**/*.py" = ["S101", "N802", "N803"]
# Alembic migrations: revision IDs no respetan naming convention.
"alembic/**/*.py" = ["N999", "E501"]
# Excepciones de dominio en español ("ExpedienteNoEncontrado" lee mejor sin
# sufijo "Error", como pediría N818). Decisión deliberada.
"praxis/domain/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# -------------------------------------------------------------------
# mypy — type checking estricto en domain/ y application/.
# -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
# Por defecto, modo permisivo en infrastructure/, api/, tests/.
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_defs = false  # se endurece selectivamente abajo

# domain/ y application/ son la "lógica núcleo" del producto. Tipado estricto allí.
[[tool.mypy.overrides]]
module = ["praxis.domain.*", "praxis.application.*"]
strict = true

# Stubs faltantes de dependencias externas — silenciamos hasta que importe.
[[tool.mypy.overrides]]
module = ["celery.*", "factory.*"]
ignore_missing_imports = true

# -------------------------------------------------------------------
# pytest — testing.
# -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "unit: tests unitarios puros (sin I/O ni DB)",
    "integration: tests que requieren DB, Redis u otros servicios externos",
]

# -------------------------------------------------------------------
# coverage — reporte de cobertura.
# -------------------------------------------------------------------

[tool.coverage.run]
source = ["praxis"]
branch = true
omit = ["praxis/api/main.py"]  # bootstrap, se prueba con tests de integración.

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

# -------------------------------------------------------------------
# uv — pinear la versión de Python.
# -------------------------------------------------------------------

[tool.uv]
# Reservado para configuración futura específica de uv si hace falta.
